services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civicfix
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix
    ports:
      - "5432:5432"
    volumes:
      - civicfix-postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix -d civicfix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/civicfix
      DATABASE_USERNAME: civicfix
      DATABASE_PASSWORD: civicfix
      DDL_AUTO: validate
      JWT_SECRET: change-this-production-jwt-secret-to-a-long-random-value
      CORS_ALLOWED_ORIGINS: http://localhost
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  civicfix-postgres:
