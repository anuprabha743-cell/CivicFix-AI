spring.application.name=civicfix-backend
server.port=8082

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:civicfix;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

jwt.secret=${JWT_SECRET:civicfix-development-secret-key-change-before-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
